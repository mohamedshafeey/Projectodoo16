name: Lint Manifests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: |
          find . -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Check XML well-formedness
        run: |
          sudo apt-get install -y libxml2-utils
          find . -name "*.xml" -print0 | xargs -0 -n1 xmllint --noout
